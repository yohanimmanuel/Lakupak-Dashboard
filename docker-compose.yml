services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file: .env
    # DATABASE_URL and DIRECT_URL come from .env (e.g. Supabase) so you can use existing users.
    # REDIS_URL comes from .env (e.g. Redis Cloud). For local Redis, run with --profile local and set REDIS_URL=redis://redis:6379 in .env or below.
    # To use the local Postgres container instead, set environment below and run: docker compose --profile local-db up
    # DB_SSL_REJECT_UNAUTHORIZED: allow Supabase TLS from inside Docker (Alpine CA store can reject Supabase cert chain)
    # WS_PORT / NEXT_PUBLIC_WS_PORT: WebSocket server runs in same container on 3001; client uses this for real-time notifications.
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      WS_PORT: "3001"
      NEXT_PUBLIC_WS_PORT: "3001"
      MEILI_HOST: http://meilisearch:7700
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_ENV: development
      # IMPORTANT: For any shared/staging/production deployment, you MUST set `MEILI_MASTER_KEY`
      # (do not rely on insecure defaults). For local-only dev you can set it in `.env`.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7700/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laku
      POSTGRES_PASSWORD: laku_secret
      POSTGRES_DB: laku
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # If 5432 is already taken on your machine, set POSTGRES_PORT=5433 (or any free port).
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laku -d laku"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Redis; only started with: docker compose --profile local up (app uses REDIS_URL from .env by default).
  redis:
    profiles:
      - local
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
  meili_data:
