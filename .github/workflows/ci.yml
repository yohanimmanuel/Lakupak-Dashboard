name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  AUTH_SECRET: ci-auth-secret-minimum-16-chars
  JWT_SECRET: ci-jwt-secret-minimum-16-chars
  REDIS_URL: redis://localhost:6379
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NODE_ENV: test

jobs:
  check:
    name: Lint, typecheck, env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate environment schema
        run: npm run validate:env
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck

  integration:
    name: Integration tests + health smoke
    runs-on: ubuntu-latest
    # Tests use in-memory fallbacks when Redis is unset; workflow-level REDIS_URL is only
    # required as a string for validate:env in the check job (no TCP connectivity check).
    env:
      REDIS_URL: ''
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
